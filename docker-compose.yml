services:
  cloak:
    build: .
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    environment:
      - PORT=3000
      - BASE_URL=${BASE_URL:-http://localhost:3000}
      - DB_PATH=/app/data/urls.db
      - MAX_LINKS=10000
      # Shown in the "Custom domain · Cloudflare Tunnel" panel so the steps
      # match how this container is actually reachable from the tunnel.
      - TUNNEL_SERVICE=${TUNNEL_SERVICE:-http://cloak:3000}
      - TUNNEL_NAME=${TUNNEL_NAME:-cloak-url}
      # Optional. The tag in https://one.dash.cloudflare.com/<tag>/... — NOT a
      # secret. With it, "open Cloudflare" links deep-link into your account.
      - CLOUDFLARE_ACCOUNT_TAG=${CLOUDFLARE_ACCOUNT_TAG:-}
    volumes:
      - ${DB_HOST_PATH:-./data}:/app/data
    restart: unless-stopped
    networks:
      - cloak-net

  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    networks:
      - cloak-net

networks:
  cloak-net:
    driver: bridge
